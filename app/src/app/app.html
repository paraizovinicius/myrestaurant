<div class="min-h-dvh flex flex-col bg-[radial-gradient(circle_at_top_left,_rgba(255,193,117,0.22),_transparent_30%),radial-gradient(circle_at_bottom_right,_rgba(92,67,50,0.55),_transparent_28%),linear-gradient(135deg,_#17110f_0%,_#241915_55%,_#120f0e_100%)] text-[#2b1a10]">
  
  
  <header class="mx-auto flex w-full items-center border border-white/10 bg-white py-4 shadow-[0_24px_80px_rgba(0,0,0,0.35)] backdrop-blur-lg sm:px-10">
    <div class="select-none font-serif text-[32px] font-bold tracking-[-0.02em] text-[#9e3d00]" aria-label="MyRestaurant">
      {{ title() }}
    </div>

    <nav class="ml-10 flex flex-1 flex-wrap items-center gap-3" aria-label="Primary navigation">
      <a
        routerLink="/"
        routerLinkActive="bg-[#9e3d00]/[0.12] font-bold border-[#9e3d00]/20"
        [routerLinkActiveOptions]="{ exact: true }"
        class="inline-flex min-h-11 items-center rounded-full border border-transparent px-4 py-2 font-medium text-[#9e3d00] transition hover:border-[#9e3d00]/20 hover:bg-[#9e3d00]/[0.06]"
      >
        Explore
      </a>

      <a
        routerLink="/restaurants"
        routerLinkActive="bg-[#9e3d00]/[0.12] font-bold border-[#9e3d00]/20"
        class="inline-flex min-h-11 items-center rounded-full border border-transparent px-4 py-2 font-medium text-[#9e3d00] transition hover:border-[#9e3d00]/20 hover:bg-[#9e3d00]/[0.06]"
      >
        Restaurants
      </a>

      <input
        class="min-h-11 md:w-[40%] w-[10%] rounded-full border border-[#9e3d00]/15 bg-white px-4 py-2 text-[#2b1a10] outline-none placeholder:text-[#9e3d00]/60 hover:placeholder:text-[#9e3d00] focus:border-[#9e3d00]/30 focus:shadow-[0_0_0_4px_rgba(158,61,0,0.08)]"
        type="search"
        name="restaurant-search"
        placeholder="Find a restaurant"
        aria-label="Find a restaurant"
        title="Find a restaurant"
      />

      <a
        routerLink="/profile"
        routerLinkActive="bg-[#7f3100] font-bold"
        class="ml-auto inline-flex min-h-11 items-center rounded-full bg-[#9e3d00] px-4 py-2 font-medium text-white transition hover:bg-[#7f3100]"
      >
        Profile
      </a>
    </nav>
  </header>

  <div class="flex-1">
    <router-outlet />
  </div>

  <footer
    class="mt-auto border-t border-[#9e3d00]/10 bg-white px-6 py-6 text-[#9e3d00] shadow-[0_-24px_80px_rgba(0,0,0,0.12)] sm:px-10"
  >
    <div
      class="mx-auto flex max-w-7xl flex-col gap-10 lg:flex-row lg:items-start lg:justify-between"
    >
      <!-- Brand -->
      <div class="max-w-xl">
        <div
          class="select-none font-serif text-[32px] font-bold tracking-[-0.02em]"
          aria-label="MyRestaurant"
        >
          {{ title() }}
        </div>

        <p class="mt-3 max-w-md text-sm leading-6 text-black/55">
          The ultimate destination for discerning diners to find, rate, and review
          the finest culinary experiences.
        </p>
      </div>

      <!-- Navigation -->
      <nav aria-label="Footer navigation">
        <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
          <a
            href="#about"
            class="group inline-flex items-center gap-2 text-[16px] font-medium transition-colors hover:text-[#7f3100]"
          >
            About Us
            <span
              class="transition-transform duration-200 group-hover:translate-x-1"
              aria-hidden="true"
            >
              →
            </span>
          </a>

          <a
            href="#contact"
            class="group inline-flex items-center gap-2 text-[16px] font-medium transition-colors hover:text-[#7f3100]"
          >
            Contact
            <span
              class="transition-transform duration-200 group-hover:translate-x-1"
              aria-hidden="true"
            >
              →
            </span>
          </a>

          <!-- Instagram -->
          <a
            href="https://www.instagram.com/YOUR_RESTAURANT/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit us on Instagram"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-[#9e3d00]/20 transition-all duration-200 hover:-translate-y-0.5 hover:border-[#9e3d00] hover:bg-[#9e3d00] hover:text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="h-5 w-5"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
        </div>
      </nav>
    </div>

    <!-- Bottom bar -->
    <div
      class="mx-auto mt-10 flex max-w-7xl flex-col gap-2 border-t border-[#9e3d00]/10 pt-5 text-sm text-black/45 sm:flex-row sm:items-center sm:justify-between"
    >
      <span>
        {{ currentYear }} &copy; MyRestaurant. All rights reserved.
      </span>

      <span>
        Made for people who love good food.
      </span>
    </div>
  </footer>
</div>
