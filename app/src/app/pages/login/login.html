<main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <section class="space-y-6 rounded-[10px] mt-10 border border-white/10 bg-white/5 p-6 shadow-[0_24px_80px_rgba(0,0,0,0.35)] backdrop-blur-lg sm:p-8">
        <h1 class="text-2xl font-semibold text-white">Login</h1>
        <p class="text-sm text-white/50">Please enter your credentials to log in.</p>

        <form class="space-y-4" (ngSubmit)="login()">
            <div>
                <label for="email" class="block text-sm font-medium text-white">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="email"
                    required
                    class="p-2 text-white mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-white">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    required
                    class="p-2 text-white mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>

            @if (error()) {
                <div class="rounded-md bg-red-500/20 p-3 text-sm text-red-200">
                    {{ error() }}
                </div>
            }
            <button
                type="submit"
                [disabled]="loading()"
                class="w-full rounded-md bg-indigo-600 py-2 px-4 text-white hover:bg-indigo-700 disabled:opacity-50">

                @if (loading()) {
                    Logging in...
                } @else {
                    Log In
                }

            </button>
        </form>
    </section>
</main>
