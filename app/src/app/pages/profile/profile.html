<main class="mx-auto mt-6 w-full max-w-[980px] space-y-4 rounded-[28px] border border-white/10 bg-white/5 p-7 text-[#f6f0e8] shadow-[0_24px_80px_rgba(0,0,0,0.35)] backdrop-blur-lg sm:p-10 lg:p-14">

  <h2 class="font-serif text-[clamp(2rem,5vw,3.5rem)] leading-[1] tracking-[-0.03em]">Your account at a glance.</h2>

  <div class="grid gap-3 md:grid-cols-3">

      <strong class="block text-base text-white">Guest</strong>

    <article class="rounded-[20px] border border-white/10 bg-black/20 p-4">

      <strong class="block text-base text-white">4 saved meals</strong>
    </article>
    <article class="rounded-[20px] border border-white/10 bg-black/20 p-4">
      <span class="mb-2 block text-[0.78rem] uppercase tracking-[0.12em] text-[#f4c98b]">Status</span>
      <strong class="block text-base text-white">Active</strong>
    </article>
  </div>
</main>
