<main class="grid grid-cols-2 gap-8 flex flex-col items-center justify-between bg-white">
    <section class="relative">
        <img class="w-full h-full object-cover" src="login_page.png" alt="login" />
        <!-- Overlay layer -->
        <div 
            class="absolute inset-0 pointer-events-none"
            style="background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.1) 100%);"
        ></div>
        <!-- I want this text to be in the middle  -->
        <div class="absolute top-3/4 -translate-y-1/2 left-8 right-8 max-w-xl space-y-4 z-10">
            <h1 class="text-4xl sm:text-5xl font-bold text-white leading-tight">
                Find where the locals actually eat.
            </h1>
            <p class="text-base sm:text-lg text-white/80">
                Community-driven ratings that help you discover understated restaurants and extraordinary food.
            </p>
        </div>
    </section>

    <!-- Update Password Form -->
    <section class="space-y-6 mt-10 p-6 sm:p-8">
        <div>
            <h1 class="font-serif text-[#9e3d00] text-2xl font-semibold">Update Password</h1>
            <p class="mt-2 text-sm text-[#351000]/70">
                Please enter your new password below.
            </p>
        </div>

        <form (ngSubmit)="updatePassword()" class="space-y-6">

            @if (error()) {
                <div class="rounded-md bg-red-500/20 p-3 text-red-900">
                    {{ error() }}
                </div>
            }

            @if (success()) {
                <div class="rounded-md bg-green-500/20 p-3 text-green-900">
                    {{ success() }}
                </div>
                <div>
                    Login with your new password <a routerLink="/login" class="text-[#9e3d00] hover:underline">here</a>.
                </div>
            }

            <div>
                <label for="newPassword" class="block text-sm font-medium">New Password</label>
                <!-- Password box -->
                <div class="relative mt-1">
                    <input
                        [type]="showPassword ? 'text' : 'password'"
                        id="password"
                        name="password"
                        [(ngModel)]="password"
                        required
                        placeholder="New password"
                        class="block w-full rounded-md border border-black bg-transparent p-2 pr-10 text-black placeholder-black/50 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    />

                    <button
                        type="button"
                        (click)="showPassword = !showPassword"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-700 hover:text-black focus:outline-none"
                        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                    >
                        <!-- Eye Closed Icon (Shown when password is hidden) -->
                        <svg
                        *ngIf="!showPassword"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="h-5 w-5"
                        >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                        />
                        </svg>

                        <!-- Eye Open Icon (Shown when password is visible) -->
                        <svg
                        *ngIf="showPassword"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="h-5 w-5"
                        >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.036 12c1.274 4.057 5.065 7 9.964 7 4.899 0 8.69-2.943 9.964-7-1.274-4.057-5.065-7-9.964-7-4.899 0-8.69 2.943-9.964 7Z"
                        />
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                        />
                        </svg>
                    </button>
                </div>

                <label for="confirmPassword" class="mt-3 block text-sm font-medium">Confirm Password</label>
                <input
                    [type]="showPassword ? 'text' : 'password'"
                    id="confirmPassword"
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    required
                    placeholder="Confirm new password"
                    class="mt-1 block w-full rounded-md border border-black bg-transparent p-2 text-black placeholder-black/40 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>

            <button
                type="submit"
                [disabled]="loading()"
                class="cursor-pointer w-full rounded-md bg-[#9e3d00] py-2 px-4 text-white hover:bg-[#7f3100] disabled:opacity-50">

                @if (loading()) {
                    Updating...
                } @else {
                    Update Password
                }

            </button>

        </form>
    </section>    
</main>
